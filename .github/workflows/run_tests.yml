name: Run tests

on:
  pull_request:
    branches: [ feedback ]

jobs:
  tests:
    name: Run tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    container:
      image: cepryh9/spbu-linux-course-lab-03:latest
      options: --user root

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Make solutions executable
      run: |
        chmod +x ./task-*/solution.sh

    - name: Run tests task-01.1
      id: task01_1
      if: always()
      run: |
       /workspace/task-01/checker.sh ./task-01/solution.sh /workspace/task-01/expected statistics

    - name: Run tests task-01.2
      id: task01_2
      if: always()
      run: |
       /workspace/task-01/checker.sh ./task-01/solution.sh /workspace/task-01/expected alice.txt && /workspace/task-01/checker.sh ./task-01/solution.sh /workspace/task-01/expected ALICE.txt

    - name: Run tests task-01.3
      id: task01_3
      if: always()
      run: |
       (/workspace/task-01/checker.sh ./task-01/solution.sh /workspace/task-01/expected alice_shuf.txt) \
         || (cp /workspace/task-01/expected/alice_shuf_1.txt /workspace/task-01/expected/alice_shuf.txt && \
             /workspace/task-01/checker.sh ./task-01/solution.sh /workspace/task-01/expected alice_shuf.txt)

    - name: Run tests task-02
      id: task02
      if: always()
      run: |
       /workspace/task-02/checker.sh ./task-02/solution.sh /workspace/task-02/expected

    - name: Run tests task-03
      id: task03
      if: always()
      run: |
       /workspace/task-03/checker.sh ./task-03/solution.sh /workspace/task-03/expected

    - name: Run tests task-04
      id: task04
      if: always()
      run: |
       /workspace/task-04/checker.sh ./task-04/solution.sh /workspace/task-04/expected

    - name: Generate test summary
      if: always()
      run: |
        # Create summary content
        SUMMARY_CONTENT=$(cat << 'EOF'
        # Test Results
        | Task | Result |
        |------|--------|
        EOF
        )

        if [ "${{ steps.task01_1.outcome }}" = "success" ]; then
          SUMMARY_CONTENT="${SUMMARY_CONTENT}\n| Task 01.1 | ✅ Passed |"
        else
          SUMMARY_CONTENT="${SUMMARY_CONTENT}\n| Task 01.1 | ❌ Failed |"
        fi

        if [ "${{ steps.task01_2.outcome }}" = "success" ]; then
          SUMMARY_CONTENT="${SUMMARY_CONTENT}\n| Task 01.2 | ✅ Passed |"
        else
          SUMMARY_CONTENT="${SUMMARY_CONTENT}\n| Task 01.2 | ❌ Failed |"
        fi

        if [ "${{ steps.task01_3.outcome }}" = "success" ]; then
          SUMMARY_CONTENT="${SUMMARY_CONTENT}\n| Task 01.3 | ✅ Passed |"
        else
          SUMMARY_CONTENT="${SUMMARY_CONTENT}\n| Task 01.3 | ❌ Failed |"
        fi

        # Add Task 02 result
        if [ "${{ steps.task02.outcome }}" = "success" ]; then
          SUMMARY_CONTENT="${SUMMARY_CONTENT}\n| Task 02 | ✅ Passed |"
        else
          SUMMARY_CONTENT="${SUMMARY_CONTENT}\n| Task 02 | ❌ Failed |"
        fi
        
        # Add Task 03 result
        if [ "${{ steps.task03.outcome }}" = "success" ]; then
          SUMMARY_CONTENT="${SUMMARY_CONTENT}\n| Task 03 | ✅ Passed |"
        else
          SUMMARY_CONTENT="${SUMMARY_CONTENT}\n| Task 03 | ❌ Failed |"
        fi
        
        # Add Task 04 result
        if [ "${{ steps.task04.outcome }}" = "success" ]; then
          SUMMARY_CONTENT="${SUMMARY_CONTENT}\n| Task 04 | ✅ Passed |"
        else
          SUMMARY_CONTENT="${SUMMARY_CONTENT}\n| Task 04 | ❌ Failed |"
        fi
        
        # Write to step summary
        echo "$SUMMARY_CONTENT" >> $GITHUB_STEP_SUMMARY
        
        # Save summary for PR comment
        echo "$SUMMARY_CONTENT" > /tmp/test_summary.md

    - name: Comment PR with test results
      if: always() && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        github-token: ${{secrets.GITHUB_TOKEN}}
        script: |
          const fs = require('fs');
          const summary = fs.readFileSync('/tmp/test_summary.md', 'utf8');
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          });
