name: Run tests

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  tests:
    name: Run tests
    runs-on: ubuntu-latest
    container:
      image: cepryh9/spbu-linux-course-lab-03:latest
      options: --user root

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run tests task-01
      id: task01
      continue-on-error: true
      run: |
        # Initialize summary table
        {
          echo "# Test Results"
          echo "| Task | Result |"
          echo "|------|--------|"
        } >> $GITHUB_STEP_SUMMARY
        
        # Run test and add result to table
        if /workspace/task-01/checker.sh /workspace/task-01/solution.sh ./task-01/solution.sh ./workspace/data; then
          echo " Task 01 passed"
          echo "| Task 01 | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
        else
          echo " Task 01 failed"
          echo "| Task 01 | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
        fi