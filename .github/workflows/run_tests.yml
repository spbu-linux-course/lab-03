name: Run tests

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  tests:
    name: Run tests
    runs-on: ubuntu-latest
    container:
      image: cepryh9/spbu-linux-course-lab-03:latest
      options: --user root

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run tests task-01
      id: task01
      continue-on-error: true
      run: |
        /workspace/task-01/checker.sh /workspace/task-01/solution.sh ./task-01/solution.sh /workspace/data

    - name: Run tests task-02
      id: task02
      continue-on-error: true
      run: |
        /workspace/task-02/checker.sh /workspace/task-02/solution.sh ./task-02/solution.sh /workspace/data

    - name: Generate test summary
      if: always()
      run: |
        echo "# Test Results" >> $GITHUB_STEP_SUMMARY
        echo "| Task | Result |" >> $GITHUB_STEP_SUMMARY
        echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
        
        # Task 01 result
        if [ "${{ steps.task01.outcome }}" = "success" ]; then
          echo "| Task 01 | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
        else
          echo "| Task 01 | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
        fi

        # Task 02 result
        if [ "${{ steps.task02.outcome }}" = "success" ]; then
          echo "| Task 02 | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
        else
          echo "| Task 02 | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
        fi